            'HeartbeatReceiver.java': {
                path: 'app/src/main/java/vn/romcn/fcmfixer/HeartbeatReceiver.java',
                desc: 'Bộ phát tín hiệu ngầm đánh thức Google FCM định kỳ ngay cả khi tắt màn hình (Doze Mode) và tự chạy lại khi khởi động máy.',
                code: `package vn.romcn.fcmfixer;

import android.app.AlarmManager;
import android.app.PendingIntent;
import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.content.SharedPreferences;
import android.os.Build;

import java.text.SimpleDateFormat;
import java.util.Date;
import java.util.Locale;

/**
 * BroadcastReceiver chịu trách nhiệm:
 * 1. Phát gói Intent nội bộ đánh thức Google Play Services (GTALK & MCS Heartbeat)
 * 2. Đặt lịch ExactAlarm cho chu kỳ tiếp theo (vượt qua chế độ nghỉ Doze Mode)
 * 3. Tự động khởi chạy lại khi người dùng khởi động lại điện thoại (BOOT_COMPLETED)
 */
public class HeartbeatReceiver extends BroadcastReceiver {

    private static final String ACTION_KEEPALIVE = "vn.romcn.fcmfixer.ACTION_KEEPALIVE_PING";

    @Override
    public void onReceive(Context context, Intent intent) {
        SharedPreferences prefs = context.getSharedPreferences(MainActivity.PREFS_NAME, Context.MODE_PRIVATE);
        boolean isEnabled = prefs.getBoolean(MainActivity.KEY_ENABLED, false);
        int interval = prefs.getInt(MainActivity.KEY_INTERVAL, 10);

        if (!isEnabled) return;

        // Phát tín hiệu ép Google Play Services kiểm tra và nối lại FCM
        sendFcmHeartbeatBroadcast(context);

        // Đặt lại lịch cho chu kỳ 5-10-15 phút kế tiếp
        scheduleNextAlarm(context, interval);
    }

    public static void sendFcmHeartbeatBroadcast(Context context) {
        // 2 Intent chuẩn của Google Services Framework giúp duy trì kết nối TCP FCM
        Intent gtalkIntent = new Intent("com.google.android.intent.action.GTALK_HEARTBEAT");
        Intent mcsIntent = new Intent("com.google.android.intent.action.MCS_HEARTBEAT");

        context.sendBroadcast(gtalkIntent);
        context.sendBroadcast(mcsIntent);

        // Lưu thời gian kích hoạt gần nhất
        String now = new SimpleDateFormat("HH:mm:ss - dd/MM", Locale.getDefault()).format(new Date());
        context.getSharedPreferences(MainActivity.PREFS_NAME, Context.MODE_PRIVATE)
                .edit()
                .putString(MainActivity.KEY_LAST_PING, now)
                .apply();
    }

    public static void scheduleNextAlarm(Context context, int intervalMinutes) {
        AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
        if (alarmManager == null) return;

        Intent intent = new Intent(context, HeartbeatReceiver.class);
        intent.setAction(ACTION_KEEPALIVE);

        int flags = PendingIntent.FLAG_UPDATE_CURRENT;
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
            flags |= PendingIntent.FLAG_IMMUTABLE;
        }

        PendingIntent pendingIntent = PendingIntent.getBroadcast(context, 1001, intent, flags);
        long triggerAtMillis = System.currentTimeMillis() + (intervalMinutes * 60 * 1000L);

        try {
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMillis, pendingIntent);
            } else {
                alarmManager.setExact(AlarmManager.RTC_WAKEUP, triggerAtMillis, pendingIntent);
            }
        } catch (SecurityException e) {
            // Dự phòng nếu máy chưa cấp quyền Exact Alarm
            alarmManager.set(AlarmManager.RTC_WAKEUP, triggerAtMillis, pendingIntent);
        }
    }

    public static void cancelAlarm(Context context) {
        AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
        if (alarmManager == null) return;

        Intent intent = new Intent(context, HeartbeatReceiver.class);
        intent.setAction(ACTION_KEEPALIVE);

        int flags = PendingIntent.FLAG_UPDATE_CURRENT;
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
            flags |= PendingIntent.FLAG_IMMUTABLE;
        }
        PendingIntent pendingIntent = PendingIntent.getBroadcast(context, 1001, intent, flags);
        alarmManager.cancel(pendingIntent);
    }
}`
