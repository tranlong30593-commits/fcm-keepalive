                <!-- Step by Step Cards -->
                <div class="space-y-3.5">
                    <!-- Step 1 -->
                    <div class="p-4 rounded-xl bg-zinc-950/80 border border-zinc-800 flex gap-3.5 items-start">
                        <div class="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">1</div>
                        <div class="text-xs space-y-1.5 flex-1">
                            <div class="font-bold text-white text-sm">Tạo kho chứa (Repository) mới trên GitHub</div>
                            <p class="text-zinc-300 leading-relaxed">
                                • Đăng nhập vào <a href="https://github.com/new" target="_blank" class="text-emerald-400 underline font-medium">github.com/new</a>.<br>
                                • Ô <strong>Repository name</strong>: gõ tên bất kỳ (ví dụ: <code>fcm-keepalive</code>).<br>
                                • Chọn <strong>Public</strong> (để dùng máy chủ build miễn phí không giới hạn), tích chọn ô <strong>Add a README file</strong>, rồi bấm nút màu xanh <strong>Create repository</strong>.
