                    <!-- Step 4 -->
                    <div class="p-4 rounded-xl bg-zinc-950/80 border border-zinc-800 flex gap-3.5 items-start">
                        <div class="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">4</div>
                        <div class="text-xs space-y-1.5 flex-1">
                            <div class="font-bold text-white text-sm">Tải file APK về điện thoại sau 90 giây</div>
                            <p class="text-zinc-300 leading-relaxed">
                                • Nhìn lên thanh menu ngang của GitHub, bấm vào mục <strong>Actions</strong> (có biểu tượng hình tròn play).<br>
                                • Bạn sẽ thấy tiến trình <strong>Build FCM Keep-Alive APK</strong> đang xoay màu vàng. Đợi khoảng 1–2 phút cho đến khi nó chuyển sang <strong>dấu tích xanh lá (✔)</strong>.<br>
                                • Bấm trực tiếp vào dòng chữ <strong>Build FCM Keep-Alive APK</strong> đó → Kéo xuống cuối trang phần <strong>Artifacts</strong> → Bấm vào <strong>FCM-KeepAlive-ROM-CN-APK</strong> để tải file nén chứa <code>app-debug.apk</code> về cài đặt!
                            </p>
                        </div>
                    </div>
                </div>

