    <script>
        const sourceFiles = {
            'MainActivity.java': {
                path: 'app/src/main/java/vn/romcn/fcmfixer/MainActivity.java',
                desc: 'Giao diện chính viết bằng Java thuần (không dùng thư viện ngoài, tạo giao diện trực tiếp bằng code để chỉ cần 1 file Java là chạy).',
                code: `package vn.romcn.fcmfixer;

import android.app.Activity;
import android.content.Context;
import android.content.Intent;
import android.content.SharedPreferences;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.provider.Settings;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.RadioButton;
import android.widget.RadioGroup;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

import java.text.SimpleDateFormat;
import java.util.Date;
import java.util.Locale;

/**
 * Ứng dụng FCM Keep-Alive cho ROM Nội Địa (CN)
 * - Không sử dụng quyền INTERNET (An toàn tuyệt đối 100%)
 * - Dung lượng sau khi đóng gói APK chỉ ~60KB
 */
public class MainActivity extends Activity {

    public static final String PREFS_NAME = "fcm_keepalive_prefs";
    public static final String KEY_ENABLED = "is_enabled";
    public static final String KEY_INTERVAL = "interval_minutes";
    public static final String KEY_LAST_PING = "last_ping_time";

    private TextView statusText;
    private TextView lastPingText;
    private Button toggleBtn;
    private SharedPreferences prefs;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);

        // Tạo giao diện trực tiếp bằng Java để không cần file XML (dễ đóng gói APK nhất)
        ScrollView scrollView = new ScrollView(this);
        scrollView.setBackgroundColor(Color.parseColor("#09090B"));
        scrollView.setFillViewport(true);

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        int pad = dp(20);
        root.setPadding(pad, dp(32), pad, pad);

        // Tiêu đề ứng dụng
        TextView title = new TextView(this);
        title.setText("FCM Keep-Alive (ROM CN)");
        title.setTextColor(Color.WHITE);
        title.setTextSize(22);
        title.setTypeface(Typeface.DEFAULT_BOLD);
        root.addView(title);

        TextView subtitle = new TextView(this);
        subtitle.setText("Duy trì kết nối Google FCM • Không quyền Internet • Siêu nhẹ");
        subtitle.setTextColor(Color.parseColor("#A1A1AA"));
        subtitle.setTextSize(13);
        subtitle.setPadding(0, dp(4), 0, dp(20));
        root.addView(subtitle);

        // Khung hiển thị trạng thái
        LinearLayout card = new LinearLayout(this);
        card.setOrientation(LinearLayout.VERTICAL);
        card.setPadding(dp(16), dp(16), dp(16), dp(16));
        GradientDrawable cardBg = new GradientDrawable();
        cardBg.setColor(Color.parseColor("#18181B"));
        cardBg.setCornerRadius(dp(16));
        cardBg.setStroke(dp(1), Color.parseColor("#27272A"));
        card.setBackground(cardBg);

        statusText = new TextView(this);
        statusText.setTextSize(16);
        statusText.setTypeface(Typeface.DEFAULT_BOLD);
        card.addView(statusText);

        lastPingText = new TextView(this);
        lastPingText.setTextSize(13);
        lastPingText.setTextColor(Color.parseColor("#A1A1AA"));
        lastPingText.setPadding(0, dp(6), 0, 0);
        card.addView(lastPingText);

        root.addView(card);

        // Lựa chọn chu kỳ 5 - 10 - 15 phút
        TextView intervalLabel = new TextView(this);
        intervalLabel.setText("Chu kỳ kiểm tra & kích hoạt lại FCM:");
        intervalLabel.setTextColor(Color.WHITE);
        intervalLabel.setTextSize(14);
        intervalLabel.setTypeface(Typeface.DEFAULT_BOLD);
        intervalLabel.setPadding(0, dp(24), 0, dp(10));
        root.addView(intervalLabel);

        RadioGroup radioGroup = new RadioGroup(this);
        radioGroup.setOrientation(RadioGroup.VERTICAL);

        int currentInterval = prefs.getInt(KEY_INTERVAL, 10);
        int[] intervals = {5, 10, 15};
        for (int min : intervals) {
            RadioButton rb = new RadioButton(this);
            rb.setId(min);
            rb.setText(min + " phút / lần" + (min == 10 ? " (Khuyên dùng)" : ""));
            rb.setTextColor(Color.parseColor("#E4E4E7"));
            rb.setTextSize(14);
            rb.setPadding(dp(8), dp(10), dp(8), dp(10));
            if (min == currentInterval) rb.setChecked(true);
            radioGroup.addView(rb);
        }

        radioGroup.setOnCheckedChangeListener((group, checkedId) -> {
            prefs.edit().putInt(KEY_INTERVAL, checkedId).apply();
            if (prefs.getBoolean(KEY_ENABLED, false)) {
                HeartbeatReceiver.scheduleNextAlarm(this, checkedId);
                Toast.makeText(this, "Đã cập nhật chu kỳ: " + checkedId + " phút", Toast.LENGTH_SHORT).show();
                updateUI();
            }
        });
        root.addView(radioGroup);

        // Nút Bật / Tắt dịch vụ
        toggleBtn = createButton("", "#10B981", Color.WHITE);
        LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
        btnParams.setMargins(0, dp(20), 0, dp(12));
        toggleBtn.setLayoutParams(btnParams);
        toggleBtn.setOnClickListener(v -> toggleService());
        root.addView(toggleBtn);

        // Nút Ping ngay lập tức
        Button forcePingBtn = createButton("⚡ Bắn tín hiệu Reconnect FCM ngay", "#27272A", Color.WHITE);
        forcePingBtn.setLayoutParams(btnParams);
        forcePingBtn.setOnClickListener(v -> {
            HeartbeatReceiver.sendFcmHeartbeatBroadcast(this);
            Toast.makeText(this, "Đã gửi tín hiệu GTALK & MCS Heartbeat!", Toast.LENGTH_SHORT).show();
            updateUI();
        });
        root.addView(forcePingBtn);

        // Nút mở *#*#426#*#*
        Button diagBtn = createButton("🔍 Mở bảng kiểm tra *#*#426#*#*", "#1E293B", Color.parseColor("#93C5FD"));
        diagBtn.setLayoutParams(btnParams);
        diagBtn.setOnClickListener(v -> openFcmDiagnostics());
        root.addView(diagBtn);

        scrollView.addView(root);
        setContentView(scrollView);

        updateUI();
    }

    private void toggleService() {
        boolean isEnabled = prefs.getBoolean(KEY_ENABLED, false);
        int interval = prefs.getInt(KEY_INTERVAL, 10);

        if (!isEnabled) {
            // Kiểm tra quyền đặt báo thức chính xác trên Android 12+ (API 31+)
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                android.app.AlarmManager am = (android.app.AlarmManager) getSystemService(Context.ALARM_SERVICE);
                if (am != null && !am.canScheduleExactAlarms()) {
                    Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                    intent.setData(Uri.parse("package:" + getPackageName()));
                    startActivity(intent);
                    Toast.makeText(this, "Vui lòng cấp quyền Đặt báo thức chính xác!", Toast.LENGTH_LONG).show();
                    return;
                }
            }
            prefs.edit().putBoolean(KEY_ENABLED, true).apply();
            HeartbeatReceiver.sendFcmHeartbeatBroadcast(this);
            HeartbeatReceiver.scheduleNextAlarm(this, interval);
            Toast.makeText(this, "Đã BẬT duy trì kết nối FCM!", Toast.LENGTH_SHORT).show();
        } else {
            prefs.edit().putBoolean(KEY_ENABLED, false).apply();
            HeartbeatReceiver.cancelAlarm(this);
            Toast.makeText(this, "Đã TẮT duy trì FCM.", Toast.LENGTH_SHORT).show();
        }
        updateUI();
    }

    private void openFcmDiagnostics() {
        try {
            // Gọi Secret Code 426 của Google Play Services
            Intent secretIntent = new Intent("android.provider.Telephony.SECRET_CODE",
                    Uri.parse("android_secret_code://426"));
            sendBroadcast(secretIntent);
        } catch (Exception e) {
            // Fallback mở trình quay số với *#*#426#*#*
            Intent dialIntent = new Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode("*#*#426#*#*")));
            startActivity(dialIntent);
        }
    }

    private void updateUI() {
        boolean isEnabled = prefs.getBoolean(KEY_ENABLED, false);
        int interval = prefs.getInt(KEY_INTERVAL, 10);
        String lastPing = prefs.getString(KEY_LAST_PING, "Chưa kích hoạt");

        if (isEnabled) {
            statusText.setText("🟢 ĐANG HOẠT ĐỘNG (" + interval + " phút/lần)");
            statusText.setTextColor(Color.parseColor("#34D399"));
            toggleBtn.setText("TẮT DUY TRÌ FCM");
            setButtonColor(toggleBtn, "#E11D48");
        } else {
            statusText.setText("⚪ ĐANG TẮT");
            statusText.setTextColor(Color.parseColor("#A1A1AA"));
            toggleBtn.setText("BẬT DUY TRÌ FCM NGAY");
            setButtonColor(toggleBtn, "#10B981");
        }
        lastPingText.setText("Lần gửi nhịp tim FCM cuối: " + lastPing);
    }

    private Button createButton(String text, String bgHex, int textColor) {
        Button btn = new Button(this);
        btn.setText(text);
        btn.setTextColor(textColor);
        btn.setAllCaps(false);
        btn.setTextSize(14);
        btn.setTypeface(Typeface.DEFAULT_BOLD);
        btn.setPadding(dp(16), dp(14), dp(16), dp(14));
        setButtonColor(btn, bgHex);
        return btn;
    }

    private void setButtonColor(Button btn, String bgHex) {
        GradientDrawable bg = new GradientDrawable();
        bg.setColor(Color.parseColor(bgHex));
        bg.setCornerRadius(dp(12));
        btn.setBackground(bg);
    }

    private int dp(int value) {
        return (int) (value * getResources().getDisplayMetrics().density);
    }
}`
