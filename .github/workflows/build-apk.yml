            <!-- VIEW 2: STEP-BY-STEP APK PACKAGING GUIDE -->
            <div id="view-guide" class="hidden flex-1 bg-zinc-900 border border-zinc-800 rounded-2xl p-6 space-y-5 overflow-y-auto">
                <div class="flex items-start justify-between gap-4 border-b border-zinc-800 pb-4">
                    <div>
                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-brands fa-github text-emerald-400 text-xl"></i>
                            Hướng dẫn chi tiết tạo APK trên GitHub (Chỉ cần tạo 1 file duy nhất!)
                        </h3>
                        <p class="text-xs text-zinc-400 mt-1">
                            Tôi đã tích hợp sẵn toàn bộ mã nguồn vào trong kịch bản <code>build-apk.yml</code>. Bạn <strong>không cần tạo từng thư mục phức tạp</strong>, chỉ cần làm đúng 4 bước dưới đây trên trình duyệt điện thoại hoặc máy tính:
                        </p>
