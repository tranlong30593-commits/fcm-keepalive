                        </div>
                    </div>

                    <!-- Step 3 -->
                    <div class="p-4 rounded-xl bg-emerald-950/20 border border-emerald-500/30 flex gap-3.5 items-start">
                        <div class="w-7 h-7 rounded-lg bg-emerald-500 text-zinc-950 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">3</div>
                        <div class="text-xs space-y-2 flex-1">
                            <div class="font-bold text-white text-sm">Dán nội dung kịch bản All-in-One và Lưu lại</div>
