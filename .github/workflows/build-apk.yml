                    <button onclick="copyCurrentCode()" id="btn-copy" class="mb-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white flex items-center gap-1.5 shrink-0 transition shadow">
