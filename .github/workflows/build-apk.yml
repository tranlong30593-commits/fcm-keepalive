                            <div class="font-bold text-white text-sm">Tạo 1 file kịch bản tự động duy nhất</div>
                            <p class="text-zinc-300 leading-relaxed">
                                • Trong trang dự án vừa tạo, bấm nút <strong>Add file</strong> → chọn <strong>Create new file</strong>.<br>
                                • Ở ô đặt tên file trên cùng (<em>Name your file...</em>), bạn copy chính xác dòng chữ dưới đây dán vào (GitHub sẽ tự động chia thư mục khi có dấu <code>/</code>):
                            </p>
                            <div class="flex items-center gap-2 bg-black px-3 py-2 rounded-lg border border-zinc-800 font-mono text-amber-300">
                                <span id="workflow-path">.github/workflows/build-apk.yml</span>
                                <button onclick="copyWorkflowPath()" class="ml-auto text-[11px] px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-sans">Copy đường dẫn</button>
