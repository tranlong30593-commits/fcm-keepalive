      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCM-KeepAlive-ROM-CN-APK
          path: app/build/outputs/apk/debug/app-debug.apk`
            }
        };

        let currentFile = 'build-apk.yml';
        let simRunning = true;
        let simInterval = 10;

        function fallbackCopyText(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        function selectFile(fileName) {
            currentFile = fileName;
            document.getElementById('code-display').textContent = sourceFiles[fileName].code;
            document.getElementById('file-desc').innerHTML = `
                <span>${sourceFiles[fileName].desc}</span>
                <span class="text-[11px] font-mono text-emerald-400">${sourceFiles[fileName].path}</span>
            `;

            Object.keys(sourceFiles).forEach(key => {
                const tab = document.getElementById('tab-' + key);
                if (key === fileName) {
                    tab.className = "px-3.5 py-2 text-xs font-mono rounded-t-lg bg-zinc-900 text-emerald-400 border-t border-x border-zinc-800 font-semibold";
                } else {
                    tab.className = "px-3.5 py-2 text-xs font-mono rounded-t-lg text-zinc-400 hover:text-zinc-200";
                }
            });
        }

        function copyCurrentCode() {
            fallbackCopyText(sourceFiles[currentFile].code);
            const btn = document.getElementById('btn-copy');
            btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Đã copy!`;
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy file này`;
            }, 1800);
        }

        function switchMainView(view) {
            const codeView = document.getElementById('view-code');
            const guideView = document.getElementById('view-guide');
            const btnCode = document.getElementById('btn-view-code');
            const btnGuide = document.getElementById('btn-view-guide');

            if (view === 'code') {
                codeView.classList.remove('hidden');
                guideView.classList.add('hidden');
                btnCode.className = "px-3.5 py-2 rounded-lg text-xs font-semibold bg-emerald-600 text-white shadow transition flex items-center gap-2";
                btnGuide.className = "px-3.5 py-2 rounded-lg text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 transition flex items-center gap-2";
            } else {
                codeView.classList.add('hidden');
                guideView.classList.remove('hidden');
                btnGuide.className = "px-3.5 py-2 rounded-lg text-xs font-semibold bg-emerald-600 text-white shadow transition flex items-center gap-2";
                btnCode.className = "px-3.5 py-2 rounded-lg text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 transition flex items-center gap-2";
            }
        }

        function setSimInterval(min) {
            simInterval = min;
            [5, 10, 15].forEach(val => {
                const btn = document.getElementById('int-' + val);
                if (val === min) {
                    btn.className = "py-2.5 rounded-xl text-xs font-semibold border border-emerald-500 bg-emerald-500/15 text-emerald-300 transition";
                } else {
                    btn.className = "py-2.5 rounded-xl text-xs font-semibold border border-zinc-800 bg-zinc-900 text-zinc-300 hover:border-zinc-700 transition";
                }
            });
            addSimLog(`Updated ExactAlarm interval -> ${min} mins`);
        }

        function toggleSimService() {
            simRunning = !simRunning;
            const badge = document.getElementById('sim-badge');
            const title = document.getElementById('sim-status-title');
            const pulse = document.getElementById('sim-pulse');
            const btn = document.getElementById('btn-sim-toggle');

            if (simRunning) {
                badge.className = "px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Đang chạy`;
                title.textContent = `Đang duy trì nhịp tim (${simInterval}p/lần)`;
                title.className = "text-sm font-bold text-emerald-400";
                pulse.classList.remove('hidden');
                btn.className = "w-full py-3 rounded-xl font-semibold text-xs bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 transition flex items-center justify-center gap-2";
                btn.innerHTML = `<i class="fa-solid fa-power-off"></i> Tắt duy trì FCM`;
                triggerManualHeartbeat();
            } else {
                badge.className = "px-2.5 py-1 rounded-full text-[11px] font-semibold bg-zinc-800 text-zinc-400 border border-zinc-700 flex items-center gap-1.5";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-zinc-500"></span> Đã tắt`;
                title.textContent = "Đã dừng duy trì FCM";
                title.className = "text-sm font-bold text-zinc-400";
                pulse.classList.add('hidden');
                btn.className = "w-full py-3 rounded-xl font-semibold text-xs bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center justify-center gap-2";
                btn.innerHTML = `<i class="fa-solid fa-play"></i> Bật duy trì FCM ngay`;
                addSimLog("Canceled ExactAlarm schedule.");
            }
        }

        function triggerManualHeartbeat() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('sim-last-ping').textContent = `Lần kích hoạt cuối: ${timeStr}`;
            document.getElementById('modal-ping-time').textContent = `${timeStr} (ACK received)`;
            addSimLog(`Sent: GTALK_HEARTBEAT & MCS_HEARTBEAT`, true);
        }

        function addSimLog(msg, highlight = false) {
            const logs = document.getElementById('sim-logs');
            const now = new Date().toTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.className = highlight ? "text-emerald-400" : "text-zinc-400";
            div.textContent = `[${now}] ${msg}`;
            logs.prepend(div);
        }

        function openFcmDiagnosticsModal() {
            const modal = document.getElementById('fcm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeFcmDiagnosticsModal() {
            const modal = document.getElementById('fcm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function copyWorkflowPath() {
            fallbackCopyText('.github/workflows/build-apk.yml');
        }

        // Initialize first file
        selectFile('build-apk.yml');
    </script>
</body>
</html>
