                                • Bấm nút <strong>Copy kịch bản build-apk.yml</strong> bên dưới rồi dán vào khung soạn thảo lớn trên GitHub.<br>
                                • Bấm nút màu xanh <strong>Commit changes...</strong> (ở góc trên bên phải) → Xác nhận <strong>Commit changes</strong> một lần nữa.
                            </p>
                            <button onclick="switchMainView('code'); selectFile('build-apk.yml'); copyCurrentCode();" class="px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs inline-flex items-center gap-2 transition">
                                <i class="fa-regular fa-copy"></i> Copy ngay nội dung file build-apk.yml
                            </button>
                        </div>
