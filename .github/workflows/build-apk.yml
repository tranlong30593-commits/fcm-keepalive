                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h2 class="text-base font-bold text-white">FCM Keep-Alive CN</h2>
                                <p class="text-[11px] text-zinc-400">v1.0 • Không quyền Internet • Siêu nhẹ</p>
                            </div>
