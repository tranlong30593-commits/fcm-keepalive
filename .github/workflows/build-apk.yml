                        Sau khi giải nén và cài file <code>app-debug.apk</code>, nếu Google Play Protect hỏi vì app tự build chưa đăng ký Store thì bạn chọn <strong>Vẫn cài đặt (Install anyway)</strong>. Sau đó vào <strong>Cài đặt ứng dụng</strong> của máy → bật <strong>Tự khởi chạy (Autostart)</strong> và <strong>Pin: Không hạn chế</strong> cho app này là xong!
