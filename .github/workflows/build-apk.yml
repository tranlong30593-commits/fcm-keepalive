                    <i class="fa-solid fa-code"></i> Mã nguồn & Đóng gói APK
                </button>
                <button onclick="switchMainView('guide')" id="btn-view-guide" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 transition flex items-center gap-2">
                    <i class="fa-solid fa-hammer"></i> Hướng dẫn tạo APK không cần cài phần mềm
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Interactive Android Simulator -->
